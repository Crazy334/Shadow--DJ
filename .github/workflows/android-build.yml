name: Build SHADOW DJ

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Audius Key
        env:
          KEY: ${{ secrets.AUDIUS_API_KEY }}
        run: |
          B64=$(printf '%s' "$KEY" | base64 -w 0)
          echo "AUDIUS_API_KEY_B64=$B64" >> "$GITHUB_ENV"

      - name: Build
        working-directory: android-project
        env:
          AUDIUS_API_KEY_B64: ${{ env.AUDIUS_API_KEY_B64 }}
        run: |
          gradle clean assembleDebug

      - name: APK
        uses: actions/upload-artifact@v4
        with:
          name: SHADOW-DJ-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
