                                  MediaItem.Builder()
                                      .setUri(uri)
                                      .setMediaMetadata(
                                          MediaMetadata.Builder()
                                              .setTitle(title)
                                              .build()
                                      )
                                      .build()
                              }

                          playbackService?.loadPlaylist(items)
                          playbackService?.play()
                      }
                  }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

