                  }
              }

              private fun getFileName(uri: Uri): String {

                  var name = "Unknown Song"

                  val cursor =
                      contentResolver.query(
                          uri,
                          arrayOf(OpenableColumns.DISPLAY_NAME),
                          null,
                          null,
                          null
                      )

                  cursor?.use {
                      if (it.moveToFirst()) {
                          name =
                              it.getString(
                                  it.getColumnIndexOrThrow(
                                      OpenableColumns.DISPLAY_NAME
                                  )
                              )
                      }
                  }

                  return name
              }

