name: Build SHADOW DJ Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Unzip SHADOW DJ Android project
        run: |
          mkdir android-project
          unzip -q SHADOW_DJ_GitHub_Phone_Upload.zip -d android-project

      - name: Find Android project
        id: project
        run: |
          PROJECT_ROOT=$(dirname "$(find android-project -name settings.gradle.kts -o -name settings.gradle | head -n 1)")
          echo "PROJECT_ROOT=$PROJECT_ROOT"
          echo "root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

      - name: Add Jango and YouTube buttons
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          MAIN=$(find app/src/main/java -name MainActivity.kt | head -n 1)

          cat > "$MAIN" <<'KOTLIN'
package com.shadowdj.app

import android.content.ComponentName
import android.content.Intent
import android.content.ServiceConnection
import android.net.Uri
import android.os.Bundle
import android.os.IBinder
import androidx.activity.ComponentActivity
import androidx.activity.compose.setContent
import androidx.activity.result.contract.ActivityResultContracts
import androidx.compose.foundation.background
import androidx.compose.foundation.layout.*
import androidx.compose.foundation.shape.RoundedCornerShape
import androidx.compose.material3.*
import androidx.compose.runtime.*
import androidx.compose.ui.Alignment
import androidx.compose.ui.Modifier
import androidx.compose.ui.graphics.Color
import androidx.compose.ui.text.font.FontWeight
import androidx.compose.ui.unit.dp
import androidx.compose.ui.unit.sp

class MainActivity : ComponentActivity() {
    private var djService: PlaybackService? = null
    private var bound = false

    private var pendingDeck = "A"

    private val picker =
        registerForActivityResult(ActivityResultContracts.OpenDocument()) { uri: Uri? ->
            uri ?: return@registerForActivityResult
            contentResolver.takePersistableUriPermission(
                uri,
                Intent.FLAG_GRANT_READ_URI_PERMISSION
            )

            if (pendingDeck == "A") {
                djService?.loadA(uri.toString())
            } else {
                djService?.loadB(uri.toString())
            }
        }

    private val connection = object : ServiceConnection {
        override fun onServiceConnected(
            name: ComponentName?,
            service: IBinder?
        ) {
            djService =
                (service as? PlaybackService.LocalBinder)?.service()
            bound = true
        }

        override fun onServiceDisconnected(name: ComponentName?) {
            bound = false
            djService = null
        }
    }

    private fun openJango() {
        startActivity(
            Intent(
                Intent.ACTION_VIEW,
                Uri.parse("https://www.jango.com/")
            )
        )
    }

    private fun openYouTube() {
        startActivity(
            Intent(
                Intent.ACTION_VIEW,
                Uri.parse("https://m.youtube.com/")
            )
        )
    }

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)

        val intent = Intent(this, PlaybackService::class.java).apply {
            action = PlaybackService.ACTION_BIND_DJ
        }

        startService(intent)
        bindService(intent, connection, BIND_AUTO_CREATE)

        setContent {
            ShadowDJScreen(
                onLoadA = {
                    pendingDeck = "A"
                    picker.launch(arrayOf("audio/*"))
                },
                onLoadB = {
                    pendingDeck = "B"
                    picker.launch(arrayOf("audio/*"))
                },
                onJango = { openJango() },
                onYouTube = { openYouTube() },
                onPlayA = { djService?.deckA?.play() },
                onPauseA = { djService?.deckA?.pause() },
                onPlayB = { djService?.deckB?.play() },
                onPauseB = { djService?.deckB?.pause() },
                onCrossfader = { djService?.setCrossfader(it) }
            )
        }
    }

    override fun onDestroy() {
        if (bound) {
            unbindService(connection)
        }
        super.onDestroy()
    }
}

