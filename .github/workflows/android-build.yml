name: Build SHADOW DJ Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Unzip SHADOW DJ Android project
        run: |
          rm -rf android-project
          mkdir android-project
          unzip -q SHADOW_DJ_GitHub_Phone_Upload.zip -d android-project

      - name: Find Android project
        id: project
        run: |
          SETTINGS=$(find android-project -name settings.gradle.kts -o -name settings.gradle | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$SETTINGS")
          echo "root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"
          echo "PROJECT_ROOT=$PROJECT_ROOT"

      - name: Update application ID
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          sed -i 's/applicationId = "com.shadowdj.app"/applicationId = "com.shadowdj.shadowdj"/' app/build.gradle.kts
          grep "applicationId" app/build.gradle.kts

      - name: Add secure permissions and network settings
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/AndroidManifest.xml")
          s = p.read_text()

          if '<uses-permission android:name="android.permission.INTERNET"/>' not in s:
              s = s.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n'
                  '    <uses-permission android:name="android.permission.INTERNET"/>\n'
                  '    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>'
              )

          s = s.replace(
              '<application android:allowBackup="true"',
              '<application android:allowBackup="false"'
          )

          if 'android:usesCleartextTraffic=' not in s:
              s = s.replace(
                  'android:supportsRtl="true">',
                  'android:supportsRtl="true"\n'
                  '        android:usesCleartextTraffic="false"\n'
                  '        android:networkSecurityConfig="@xml/network_security_config">'
              )

          p.write_text(s)
          PY

          mkdir -p app/src/main/res/xml

          cat > app/src/main/res/xml/network_security_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="false">
                  <trust-anchors>
                      <certificates src="system"/>
                  </trust-anchors>
              </base-config>
          </network-security-config>
          EOF

      - name: Replace PlaybackService with background music player
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          cat > app/src/main/java/com/shadowdj/app/PlaybackService.kt <<'EOF'
          package com.shadowdj.app

          import android.content.Intent
          import android.os.Binder
          import android.os.IBinder
          import androidx.media3.common.MediaItem
          import androidx.media3.common.Player
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.session.MediaSession
          import androidx.media3.session.MediaSessionService

          class PlaybackService : MediaSessionService() {

              inner class LocalBinder : Binder() {
                  fun service(): PlaybackService = this@PlaybackService
              }

              private val localBinder = LocalBinder()

              lateinit var player: ExoPlayer
                  private set

              private var mediaSession: MediaSession? = null

              private var master = 1.0f
              private var crossfader = 0.5f
              private var deckA = 1.0f
              private var deckB = 1.0f

              override fun onCreate() {
                  super.onCreate()

                  player = ExoPlayer.Builder(this)
                      .setHandleAudioBecomingNoisy(true)
                      .build()

                  player.repeatMode = Player.REPEAT_MODE_OFF

                  mediaSession = MediaSession.Builder(this, player)
                      .setCallback(object : MediaSession.Callback {})
                      .build()
              }

              override fun onBind(intent: Intent?): IBinder? {
                  return if (intent?.action == ACTION_BIND_DJ) {
                      localBinder
                  } else {
                      super.onBind(intent)
                  }
              }

              fun loadPlaylist(items: List<MediaItem>) {
                  player.setMediaItems(items)
                  player.prepare()
              }

              fun addSong(item: MediaItem) {
                  player.addMediaItem(item)

                  if (player.playbackState == Player.STATE_IDLE) {
                      player.prepare()
                  }
              }

              fun play() {
                  player.play()
              }

              fun pause() {
                  player.pause()
              }

              fun next() {
                  if (player.hasNextMediaItem()) {
                      player.seekToNextMediaItem()
                  }
              }

              fun previous() {
                  if (player.hasPreviousMediaItem()) {
                      player.seekToPreviousMediaItem()
                  }
              }

              fun toggleShuffle() {
                  player.shuffleModeEnabled = !player.shuffleModeEnabled
              }

              fun toggleRepeat() {
                  player.repeatMode =
                      when (player.repeatMode) {
                          Player.REPEAT_MODE_OFF ->
                              Player.REPEAT_MODE_ALL

                          Player.REPEAT_MODE_ALL ->
                              Player.REPEAT_MODE_ONE

                          else ->
                              Player.REPEAT_MODE_OFF
                      }
              }

              fun setMaster(value: Float) {
                  master = value.coerceIn(0f, 1f)
                  applyVolume()
              }

              fun setCrossfader(value: Float) {
                  crossfader = value.coerceIn(0f, 1f)
                  applyVolume()
              }

              fun setDeckVolume(deck: String, value: Float) {
                  if (deck == "A") {
                      deckA = value.coerceIn(0f, 1f)
                  } else {
                      deckB = value.coerceIn(0f, 1f)
                  }

                  applyVolume()
              }

              private fun applyVolume() {
                  val mix =
                      if (crossfader <= 0.5f) {
                          deckA * (1f - crossfader)
                      } else {
                          deckB * crossfader
                      }

                  player.volume =
                      (mix * master).coerceIn(0f, 1f)
              }

              override fun onGetSession(
                  controllerInfo: MediaSession.ControllerInfo
              ): MediaSession? {
                  return mediaSession
              }

              override fun onTaskRemoved(rootIntent: Intent?) {
                  if (player.isPlaying) {
                      player.play()
                  }

                  super.onTaskRemoved(rootIntent)
              }

              override fun onDestroy() {
                  mediaSession?.release()
                  player.release()
                  super.onDestroy()
              }

              companion object {
                  const val ACTION_BIND_DJ =
                      "com.shadowdj.app.BIND_DJ"
              }
          }
          EOF

