name: Build SHADOW DJ Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Unzip SHADOW DJ Android project
        run: |
          rm -rf android-project
          mkdir android-project
          unzip -q SHADOW_DJ_GitHub_Phone_Upload.zip -d android-project

          echo "===== PROJECT FILES ====="
          find android-project -maxdepth 6 -type f | sort | head -250

      - name: Find Android project
        id: project
        run: |
          SETTINGS=$(find android-project -name settings.gradle.kts -o -name settings.gradle | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle file not found"
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$SETTINGS")

          echo "PROJECT_ROOT=$PROJECT_ROOT"
          echo "root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

      - name: Check Android project
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          echo "===== MANIFEST ====="
          cat app/src/main/AndroidManifest.xml

          echo "===== BUILD CONFIG BEFORE CHANGE ====="
          cat app/build.gradle.kts

      - name: Use fresh test application ID
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          sed -i 's/applicationId = "com.shadowdj.app"/applicationId = "com.shadowdj.shadowdj"/' app/build.gradle.kts

          echo "===== BUILD CONFIG AFTER CHANGE ====="
          cat app/build.gradle.kts

          echo "===== APPLICATION ID CHECK ====="
          grep "applicationId" app/build.gradle.kts

      - name: Enable AndroidX
        run: |
          mkdir -p "${{ steps.project.outputs.root }}/gradle"
          cat > "${{ steps.project.outputs.root }}/gradle.properties" <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.jvm.target.validation.mode=warning
          EOF

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build SHADOW DJ APK
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon

      - name: Find APK
        id: apk
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created"
            exit 1
          fi

          echo "APK=$APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Verify APK
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          APK="${{ steps.apk.outputs.apk }}"

          echo "===== APK FILE ====="
          ls -lh "$APK"

          echo "===== APK PACKAGE ====="
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | head -20

          echo "===== APK SIGNATURE ====="
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"

      - name: Package APK
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          APK="${{ steps.apk.outputs.apk }}"

          rm -rf /tmp/shadow-dj
          mkdir -p /tmp/shadow-dj

          cp "$APK" /tmp/shadow-dj/SHADOW-DJ.apk

          cd /tmp/shadow-dj
          zip -q SHADOW-DJ-APK.zip SHADOW-DJ.apk

          echo "===== DOWNLOAD FILE ====="
          ls -lh SHADOW-DJ-APK.zip

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SHADOW-DJ-APK
          path: /tmp/shadow-dj/SHADOW-DJ-APK.zip
          if-no-files-found: error
