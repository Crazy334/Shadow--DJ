name: Build SHADOW DJ

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Audius key
        env:
          AUDIUS_API_KEY: ${{ secrets.AUDIUS_API_KEY }}
        run: |
          KEY="$(printf '%s' "$AUDIUS_API_KEY" | tr -d '\r\n')"
          KEY_B64="$(printf '%s' "$KEY" | base64 -w 0)"
          echo "AUDIUS_API_KEY_B64=$KEY_B64" >> "$GITHUB_ENV"

      - name: Create Android project
        run: |
          rm -rf android-project

          mkdir -p android-project/app/src/main/java/com/shadowdj/shadowdj
          mkdir -p android-project/app/src/main/res/values
          mkdir -p android-project/app/src/main/res/xml

          cd android-project

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "SHADOW-DJ"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.jvm.target.validation.mode=warning
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          val audiusApiKeyBase64 =
              System.getenv("AUDIUS_API_KEY_B64") ?: ""

          android {
              namespace = "com.shadowdj.shadowdj"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.shadowdj.shadowdj"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 32
                  versionName = "3.2.0"

                  buildConfigField(
                      "String",
                      "AUDIUS_API_KEY_B64",
                      "\"$audiusApiKeyBase64\""
                  )
              }

              buildFeatures {
                  buildConfig = true
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.activity:activity-ktx:1.10.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.media3:media3-exoplayer:1.5.1")
              implementation("androidx.media3:media3-session:1.5.1")
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="Theme.ShadowDJ"
                  parent="android:style/Theme.Material.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#FFFFFF</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:windowLightStatusBar">false</item>

              </style>
          </resources>
          EOF

          cat > app/src/main/res/xml/network_security_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <network-security-config>
              <base-config cleartextTrafficPermitted="false" />
          </network-security-config>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>

              <application
                  android:allowBackup="false"
                  android:label="SHADOW DJ"
                  android:theme="@style/Theme.ShadowDJ"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="false"
                  android:networkSecurityConfig="@xml/network_security_config">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:supportsPictureInPicture="true"
                      android:configChanges="screenSize|smallestScreenSize|screenLayout|orientation">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".PlaybackService"
                      android:foregroundServiceType="mediaPlayback"
                      android:exported="true"
                      android:stopWithTask="false">

                      <intent-filter>
                          <action android:name="androidx.media3.session.MediaSessionService"/>
                          <action android:name="android.media.browse.MediaBrowserService"/>
                      </intent-filter>

                  </service>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/shadowdj/shadowdj/PlaybackService.kt <<'EOF'
