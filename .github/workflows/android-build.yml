name: Build Simple Android Test APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create simple Android project
        run: |
          rm -rf simple-test
          mkdir -p simple-test/app/src/main/java/com/test/simple
          mkdir -p simple-test/app/src/main/res/values

          cat > simple-test/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "SimpleTest"
          include(":app")
          EOF

          cat > simple-test/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
          }
          EOF

          cat > simple-test/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.test.simple"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.test.simple"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
          }
          EOF

          cat > simple-test/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          EOF

          cat > simple-test/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:theme="@style/AppTheme"
                  android:label="Simple Test">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > simple-test/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#000000</item>
              </style>
          </resources>
          EOF

          cat > simple-test/app/src/main/java/com/test/simple/MainActivity.java <<'EOF'
          package com.test.simple;

          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.TextView;

          public class MainActivity extends Activity {

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  TextView text = new TextView(this);
                  text.setText("SHADOW DJ INSTALL TEST");
                  text.setTextSize(24);
                  text.setPadding(40, 40, 40, 40);

                  setContentView(text);
              }
          }
          EOF

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build test APK
        working-directory: simple-test
        run: |
          gradle clean assembleDebug --no-daemon

      - name: Verify APK
        working-directory: simple-test
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          echo "===== APK ====="
          ls -lh "$APK"

          echo "===== PACKAGE ====="
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | head -15

          echo "===== SIGNATURE ====="
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"

      - name: Package APK
        run: |
          mkdir -p /tmp/simple-test
          cp simple-test/app/build/outputs/apk/debug/app-debug.apk /tmp/simple-test/Simple-Test.apk

          cd /tmp/simple-test
          zip -q Simple-Test-APK.zip Simple-Test.apk

          ls -lh Simple-Test-APK.zip

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: Simple-Test-APK
          path: /tmp/simple-test/Simple-Test-APK.zip
          if-no-files-found: error
