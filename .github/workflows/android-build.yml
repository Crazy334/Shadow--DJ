name: Inspect SHADOW DJ Android Project

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir android-project
          unzip -q SHADOW_DJ_GitHub_Phone_Upload.zip -d android-project

      - name: Show Android files
        run: |
          echo "===== PROJECT FILES ====="
          find android-project -type f | sort

      - name: Show MainActivity.kt
        run: |
          echo "===== MainActivity.kt ====="
          cat "$(find android-project -name MainActivity.kt | head -n 1)"

      - name: Show AndroidManifest.xml
        run: |
          echo "===== AndroidManifest.xml ====="
          cat "$(find android-project -name AndroidManifest.xml | head -n 1)"

      - name: Show PlaybackService.kt
        run: |
          echo "===== PlaybackService.kt ====="
          cat "$(find android-project -name PlaybackService.kt | head -n 1)"

      - name: Show app build.gradle.kts
        run: |
          echo "===== app/build.gradle.kts ====="
          cat "$(find android-project -path "*/app/build.gradle.kts" | head -n 1)"
